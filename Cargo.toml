[package]
name = "rodii-power-menu"
version = "0.1.0"
edition = "2021"
description = "Which-key style power/system menu for niri, described by a KDL file, shown with fuzzel"
license = "MIT"
repository = "https://github.com/rdlu/rodii-power-menu"
publish = false

[dependencies]
kdl = "6.7.1"
libc = "0.2"
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
serde = { version = "1.0.229", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
